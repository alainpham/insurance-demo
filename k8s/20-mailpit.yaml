apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: assurance
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: assurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: assurance
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          env:
            - name: MP_MAX_MESSAGES
              value: "500"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "1"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "1"
          ports:
            - containerPort: 8025
              name: http
            - containerPort: 1025
              name: smtp
          readinessProbe:
            httpGet: { path: /, port: 8025 }
            periodSeconds: 3
            failureThreshold: 30
          resources:
            requests: { cpu: "20m", memory: "48Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: assurance
  labels:
    app.kubernetes.io/name: mailpit
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8025
      targetPort: 8025
    - name: smtp
      port: 1025
      targetPort: 1025
  selector:
    app.kubernetes.io/name: mailpit
